<text x="36" y="62" text-anchor="start" class="sans" font-size="34" fill="#1f2937">
<tspan x="36" dy="0">Haven runtime</tspan>
</text>
<text x="36" y="97" text-anchor="start" class="sans" font-size="20" fill="#64748b">
<tspan x="36" dy="0">Self-hosted · One Go process serves the web UI and JSON API</tspan>
</text>
<text x="478" y="168" text-anchor="start" class="sans" font-size="22" fill="#1971c2">
<tspan x="478" dy="0">Go server</tspan>
</text>
<text x="154.5" y="211" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="154.5" dy="0">Web browser</tspan>
</text>
<text x="154.5" y="232" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="154.5" dy="0">Resident and operator portals</tspan>
<tspan x="154.5" dy="17.4">HTML, CSS and JavaScript</tspan>
</text>
<text x="642" y="210" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="642" dy="0">HTTP routes and sessions</tspan>
</text>
<text x="642" y="231" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="642" dy="0">Static assets, JSON API and</tspan>
<tspan x="642" dy="17.4">in-memory cookie sessions</tspan>
</text>
<text x="642" y="360" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="642" dy="0">Permissions and actions</tspan>
</text>
<text x="642" y="381" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="642" dy="0">Role-scoped views, booking rules</tspan>
<tspan x="642" dy="17.4">and state validation</tspan>
</text>
<text x="1107" y="358" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="1107" dy="0">JSON state file</tspan>
</text>
<text x="1107" y="379" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="1107" dy="0">data/state.json</tspan>
<tspan x="1107" dy="17.4">Revision-checked writes</tspan>
</text>
<text x="295.5" y="222" text-anchor="start" class="mono" font-size="14" fill="#1f2937">
<tspan x="295.5" dy="0">Load UI / call API</tspan>
</text>
<text x="657" y="312" text-anchor="start" class="mono" font-size="14" fill="#1f2937">
<tspan x="657" dy="0">Apply role and rules</tspan>
</text>
<text x="826" y="360" text-anchor="start" class="mono" font-size="14" fill="#1f2937">
<tspan x="826" dy="0">Read / save state</tspan>
</text>
<text x="74" y="479" text-anchor="start" class="sans" font-size="16" fill="#64748b">
<tspan x="74" dy="0">Implemented component</tspan>
</text>
<text x="326" y="482" text-anchor="start" class="sans" font-size="22" fill="#1f2937">
<tspan x="326" dy="0">→</tspan>
</text>
<text x="365" y="479" text-anchor="start" class="sans" font-size="16" fill="#64748b">
<tspan x="365" dy="0">Request, call or file operation</tspan>
</text>
